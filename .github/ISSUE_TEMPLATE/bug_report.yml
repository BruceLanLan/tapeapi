name: Bug report / 缺陷报告
description: Something in the SDK, provider runtime, contracts, examples, live services or site is wrong. 代码或线上服务的问题。
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues do not go here.** Use [private vulnerability reporting](https://github.com/BruceLanLan/tapeapi/security/advisories/new) — see [SECURITY.md](https://github.com/BruceLanLan/tapeapi/blob/main/SECURITY.md).
        **安全问题不要发在这里**，请走[私密报告](https://github.com/BruceLanLan/tapeapi/security/advisories/new)，见 [SECURITY.md](https://github.com/BruceLanLan/tapeapi/blob/main/SECURITY.md)。

        A live service looks down? Check the [status page](https://tapeapi.fun/status/) first: the monitor opens an issue on its own. 线上服务像是挂了？先看[状态页](https://tapeapi.fun/status/)，监控会自动开 issue。
  - type: dropdown
    id: component
    attributes:
      label: Component / 组件
      options:
        - "sdk (@tapeapi/sdk)"
        - "server (@tapeapi/server)"
        - "contracts"
        - "examples"
        - "conformance suite"
        - "public service (api.tapeapi.fun, 11.1013.tape)"
        - "public relay (relay.tapeapi.fun, 12.1013.tape)"
        - "playground (tapeapi.fun/playground)"
        - "holder console (tapeapi.fun/console)"
        - "docs site / guides / README"
        - "status page / monitor"
        - "scripts"
        - "not sure / 不确定"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / 实际发生了什么
      description: Include the exact error or output (the error code, e.g. `DELEGATION_INVALID`, if there is one). 请附上确切的报错或输出（有错误码就写上）。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / 你期待的行为
      description: If a TAP or DESIGN.md says otherwise, cite the section. 若某个 TAP 或 DESIGN.md 另有规定，请引用章节号。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction / 最小复现
      description: Commands, a failing test, a short script, or the service name and method you called. A failing test is ideal. 命令、失败的测试、短脚本，或你调用的服务名与方法；失败的测试最佳。
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA or URL / 提交号或网址
      description: The commit you ran, or the page URL for a site problem. 你运行的提交号；站点问题填页面网址。
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment / 环境
      description: "Node version, OS, browser, forge version if relevant. 例：Node 22.11 / macOS 15 / Chrome 140 / forge 1.3"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前
      options:
        - label: "This is not a security vulnerability. 这不是安全漏洞。"
          required: true
        - label: "For a code bug: I ran `npm test`, `python3 spec/vectors/verify.py` and `cd contracts && forge test` on a clean checkout. 代码问题：我在干净检出上跑过三套测试。"
        - label: "No private keys, .env contents, mnemonics or keyed RPC URLs in this report. 报告中没有私钥、.env 内容、助记词或带 API Key 的 RPC URL。"
          required: true

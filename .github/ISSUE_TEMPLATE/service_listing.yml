name: Share a service / 分享你的服务
description: Tell us about a TapeAPI service you run, so others can find it. 介绍你运行的 TapeAPI 服务，方便别人找到它。
title: "[service] "
labels: ["service-listing"]
body:
  - type: markdown
    attributes:
      value: |
        A service needs **no permission from us and no listing** to work: anyone can resolve it by its TapeOut name (`<#ID>.<processor>.tape`, e.g. `11.1013.tape`) and the SDK checks everything on-chain. This issue only helps people find it; we may link shared services from the docs, and a service directory is on the [roadmap](https://github.com/BruceLanLan/tapeapi/blob/main/docs/ROADMAP.md).
        Sharing confers **no authority and no endorsement**: clients always derive the container on-chain and verify signatures themselves (TAP-20 §3.6). We do not vet or take responsibility for any shared service, and a link can be removed.

        服务的运行**不需要我们的许可，也不需要登记**：任何人都能用它的 TapeOut 名称（`<#ID>.<processor>.tape`，例如 `11.1013.tape`）解析它，SDK 会在链上核对一切。本 issue 只是方便别人找到它；我们可能在手册里链接分享的服务，服务目录在[路线图](https://github.com/BruceLanLan/tapeapi/blob/main/docs/ROADMAP.md)上。
        分享**不代表任何权威或背书**：客户端始终自行链上推导容器并验签（TAP-20 §3.6）。我们不审核、不对任何服务负责，链接也可能被移除。
  - type: input
    id: tapename
    attributes:
      label: TapeOut name / TapeOut 名称
      description: "e.g. 11.1013.tape — the name the playground and `api.resolve()` accept. 例如 11.1013.tape，即调试台与 `api.resolve()` 接受的名称。"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does / 它做什么
      description: One or two sentences for a developer deciding whether to call it. 一两句话，给正在决定要不要调用它的开发者看。
    validations:
      required: true
  - type: textarea
    id: methods
    attributes:
      label: Methods / 方法
      description: "Name, free or priced, and [quorum] or [no-quorum] for each. 每个方法的名称、免费或价格，以及 [quorum] / [no-quorum]。"
    validations:
      required: true
  - type: textarea
    id: playground
    attributes:
      label: Playground check / 调试台核对结果
      description: "Open https://tapeapi.fun/playground/, enter the name, call one method, and paste what the checks say (or a screenshot). 打开调试台，输入名称，调用一个方法，贴上核对结果（或截图）。"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source code or website (optional) / 源码或网站（可选）
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations / 确认
      options:
        - label: "I hold the circuit, or I run the service for its holder with their consent. 我持有该电路，或经持有人同意代为运行。"
          required: true
        - label: "The playground resolves the name and verifies a signed answer from it. 调试台能解析该名称并验证其签名响应。"
          required: true
        - label: "I understand sharing confers no endorsement and a link can be removed. 我理解分享不代表背书，链接可能被移除。"
          required: true

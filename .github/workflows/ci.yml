# Every push and pull request runs the three suites: JavaScript, the independent Python verifier, and Foundry, and checks
# the provider directory's format (site/directory/providers.json; no network: the daily recheck reads the chain).
# 每次推送和拉取请求都跑三套测试：JavaScript、独立的 Python 校验器、Foundry，并检查服务方目录的格式（不联网；读链交给每日复核）。
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The public repository only (the workflow also exists in the private copy it is staged from).
    # 只在公开仓库运行（私有仓库里也有同一份文件）。
    if: github.repository == 'BruceLanLan/tapeapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]   # package.json engines says >= 20 / engines 声明 >= 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - run: npm ci
      - run: npm test
      - run: python3 spec/vectors/verify.py
      - run: forge test
        working-directory: contracts

  directory:
    # A pull request that lists a provider edits site/directory/providers.json: its format and its order are checked here,
    # with no RPC and no call to any service (directory-recheck.yml runs tapeapi-doctor once a day). It runs on every
    # push and pull request because a paths filter at the top would apply to the test job too; it takes seconds.
    # 登记服务方的拉取请求修改 providers.json：这里只查格式与顺序，不发 RPC、不调用任何服务（诊断由每日任务运行）。
    # 每次都运行，因为顶层的路径过滤也会作用于测试任务；只需几秒。
    if: github.repository == 'BruceLanLan/tapeapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node directory/recheck.mjs --validate

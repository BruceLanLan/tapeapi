# Every push and pull request runs the three suites: JavaScript, the independent Python verifier, and Foundry.
# 每次推送和拉取请求都跑三套测试：JavaScript、独立的 Python 校验器、Foundry。
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The public repository only (the workflow also exists in the private copy it is staged from).
    # 只在公开仓库运行（私有仓库里也有同一份文件）。
    if: github.repository == 'BruceLanLan/tapeapi'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm test
      - run: python3 spec/vectors/verify.py
      - run: forge test
        working-directory: contracts

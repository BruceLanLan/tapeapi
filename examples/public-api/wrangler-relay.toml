# The project's own public relay, relay.tapeapi.fun (12.1013.tape). Deployed by Cloudflare Workers Builds with
# `npm run deploy:relay`; not for forks: a fork deploys the template examples/cloudflare-worker/wrangler-relay.toml
# with `npm run deploy:my-relay`. The Worker keeps its name, Durable Object class and migration tag, so its rooms,
# secret and dashboard variables stay.
# 本项目自己的公共中继 relay.tapeapi.fun（12.1013.tape），由 Cloudflare Workers Builds 以 `npm run deploy:relay` 部署；
# 不是给 fork 用的：fork 用 `npm run deploy:my-relay` 部署模板 examples/cloudflare-worker/wrangler-relay.toml。
# Worker 名称、Durable Object 类名与迁移标签保持不变，房间、密钥与后台变量因此保留。
name = "tapeapi-relay"
main = "../cloudflare-worker/relay-worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the dashboard (CIRCUITS, TOKEN_ID, CONTAINER, DELEGATION_EXPIRES, DELEGATION_SIG) survive deploys.
# 后台设置的变量在部署之间保留。
keep_vars = true

[[routes]]
pattern = "relay.tapeapi.fun"
custom_domain = true

# One Durable Object per room: the only way every isolate sees the same room.
# 每个房间一个 Durable Object：这是让所有隔离实例看到同一个房间的唯一办法。
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# The meter of a PRICED relay (RELAY_PRICE_BEM != "0"), and required for one: relay-worker.js refuses to start a
# priced relay without it, because a meter in isolate memory serves each voucher once per isolate (arch A1).
# A free relay needs no D1. Create it, apply the schema in d1-store.js, then uncomment and put in its id:
#   npx wrangler d1 create tapeapi-relay-meter
# 收费中继（RELAY_PRICE_BEM 不为 "0"）的计量库，且是必需的：没有它 relay-worker.js 拒绝启动收费中继，因为放在隔离实例内存里的
# 计量会让每张凭证在每个实例各服务一次（arch A1）。免费中继不需要 D1。先创建、按 d1-store.js 建表，再取消注释并填入 id。
# [[d1_databases]]
# binding = "DB"
# database_name = "tapeapi-relay-meter"
# database_id = "REPLACE-WITH-THE-ID-FROM-wrangler-d1-create"

[observability]
enabled = true

[vars]
SERVICE_NAME = "relay.tape"
PUBLIC_URL = "https://relay.tapeapi.fun"
RELAY_PRICE_BEM = "0"
# New rooms one client IP may create per minute, per isolate (arch A2). / 每个客户端 IP 每分钟（每个隔离实例）可新建的房间数。
RATE_NEW_ROOMS = "60"
# RELAY_SWEEP_MS / RELAY_ROOM_TTL_MS shorten the room alarm and lifetime for smoke-local.mjs only; never set them here.
# RELAY_SWEEP_MS / RELAY_ROOM_TTL_MS 只供 smoke-local.mjs 缩短房间 alarm 与寿命；不要在这里设置。
# The identity is NOT set here: a value in this file would overwrite the dashboard's on every deploy. Set CIRCUITS,
# TOKEN_ID, CONTAINER, DELEGATION_EXPIRES and DELEGATION_SIG in the dashboard (the holder console shows them), and the
# secret SIGNER_KEY; until then the relay answers only its health, in setup mode.
# 身份不写在这里：写在本文件里的值每次部署都会覆盖后台的值。CIRCUITS 等变量在后台设置（持有人控制台会显示），
# 密钥 SIGNER_KEY 设为 Secret；在此之前中继处于设置模式，只回答健康检查。

# The public TapeAPI service, api.tapeapi.fun. Deployed by Cloudflare Workers Builds with `npm run deploy:public`.
# The Worker keeps the name of the first deployment so its secret and variables stay; keep_vars keeps the ones set in
# the dashboard (CIRCUITS, TOKEN_ID, CONTAINER, DELEGATION_EXPIRES, DELEGATION_SIG) across deploys.
# 公共 TapeAPI 服务 api.tapeapi.fun，由 Cloudflare Workers Builds 以 `npm run deploy:public` 部署。
# Worker 沿用首次部署的名字，密钥和变量因此保留；keep_vars 让后台设置的变量在部署之间保留。
name = "tapeapi-provider"
main = "worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[[routes]]
pattern = "api.tapeapi.fun"
custom_domain = true

# Logs, api.tapeapi.fun (a public service we run; privacy plan 2026-09-28, site/privacy/): Cloudflare's per-request
# invocation logs and traces are OFF, query strings are redacted. What stays is the Worker's own console output
# (one line per MCP message: method, tool and a caller tag that is an HMAC of the IP and the UTC day, never the IP), kept by Workers Logs for the plan's retention. Whether Cloudflare's own
# records of a request include the client IP is to be verified. Takes effect on the next deploy.
# 日志（api.tapeapi.fun，我们运营的公共服务；隐私计划 2026-09-28，见 site/privacy/）：关闭 Cloudflare 的逐请求调用日志与追踪，
# 隐去查询串。保留的只有 Worker 自己的 console 输出（每条 MCP 消息一行：方法、工具，以及由 IP 与 UTC 日期做 HMAC 得到的调用方标签，从不记录 IP 本身），按套餐的保留期存在 Workers Logs。
# Cloudflare 自己对请求的记录是否含客户端 IP：待核实。下次部署后生效。
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[vars]
SERVICE_NAME = "TapeAPI Public"
# The TapeOut name the MCP endpoint shows in its receipts. / MCP 端点在回执里展示的 TapeOut 名称。
TAPE_NAME = "11.1013.tape"
PUBLIC_URL = "https://api.tapeapi.fun"
# Three operators (NodeReal, Alchemy, 48 Club), the SDK's rpcUrlsFor(56); quorum 2 counts operators, not URLs.
# 三家运营方（SDK 的 rpcUrlsFor(56)）；quorum 2 按运营方计，不按 URL。
RPC_URLS = "https://bsc-dataseed.bnbchain.org,https://bsc-mainnet.public.blastapi.io,https://rpc-bsc.48.club"
RPC_TIMEOUT_MS = "3000"

# The MCP signing proxy on its own Worker and its own hostname: a template. Deploy with
#   npx --yes wrangler@4.141.0 deploy -c examples/mcp-proxy/wrangler.toml
# Your MCP server stays where it is; UPSTREAM_URL points at it.
# 独立 Worker、独立主机名上的 MCP 签名代理模板。你的 MCP 服务器留在原处，UPSTREAM_URL 指向它。
name = "my-tapeapi-mcp-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the dashboard survive a redeploy / 后台设置的变量在重新部署后保留
keep_vars = true

# A subdomain of yours, never a path on an existing site: the endpoint URL is written into the on-chain manifest.
# Add it in the dashboard (Worker -> Settings -> Domains & Routes -> Custom domain) and set PUBLIC_URL to it, or
# uncomment and edit these lines. / 用你自己的子域名：端点 URL 写在链上清单里。在后台添加自定义域名并把 PUBLIC_URL 设为它，
# 或取消下面的注释并修改。
# [[routes]]
# pattern = "mcp.example.com"
# custom_domain = true

# Logs: Cloudflare's per-request invocation logs and traces are OFF by default here, query strings redacted; the
# Worker's own console output (errors, setup notes) is kept. While debugging, set invocation_logs = true for a while:
# those records describe every request, and whether they include the client IP is to be verified.
# 日志：这里默认关闭 Cloudflare 的逐请求调用日志与追踪，隐去查询串；保留 Worker 自己的 console 输出（错误、设置提示）。
# 排查问题时可临时把 invocation_logs 设为 true：那些记录描述每个请求，是否含客户端 IP 待核实。
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[vars]
SERVICE_NAME = "My MCP server"
# The Streamable HTTP endpoint of YOUR MCP server. Edit this line. / 你的 MCP 服务器的 Streamable HTTP 端点。改这一行。
UPSTREAM_URL = "https://your-mcp-server.example/mcp"
# PUBLIC_URL = "https://mcp.example.com"   this Worker's own https hostname / 本 Worker 自己的 https 主机名
# CIRCUITS, TOKEN_ID, CONTAINER, DELEGATION_EXPIRES and DELEGATION_SIG are set in the Cloudflare dashboard (Settings ->
# Variables and Secrets), as the holder console at tapeapi.fun/console shows them. After you publish the manifest, set
# TOOLS_SHA256 to the mcp.toolsSha256 you published: a new isolate then refuses changed tools instead of adopting them.
# 这几个变量在 Cloudflare 后台设置（操作台会给出值）。发布清单后，把 TOOLS_SHA256 设为你发布的 mcp.toolsSha256：
# 新的隔离实例会拒绝被改过的工具，而不是接受它们。

# Secrets, set in the dashboard (type Secret) or with `npx wrangler secret put <NAME>`, never in this file:
#   SIGNER_KEY               the hot signing key named by the delegation / 委托指定的热签名密钥
#   UPSTREAM_AUTHORIZATION   optional: the Authorization header your MCP server expects, e.g. "Bearer ..."
#                            可选：你的 MCP 服务器要求的 Authorization 头

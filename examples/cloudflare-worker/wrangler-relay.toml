# A TAPI-26 relay on its own Worker and its own hostname: the template a fork deploys with `npm run deploy:my-relay`
# (from the repository root; the wrangler version is pinned in package.json). Rename the Worker if you like. The
# project's own public relay (relay.tapeapi.fun) deploys from examples/public-api/wrangler-relay.toml.
# 独立 Worker、独立主机名上的 TAPI-26 中继：fork 用 `npm run deploy:my-relay` 部署的模板（在仓库根目录运行；wrangler 版本
# 写死在 package.json）。Worker 名字可以改。本项目的公共中继（relay.tapeapi.fun）从 examples/public-api/wrangler-relay.toml 部署。
name = "my-tapeapi-relay"
main = "relay-worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the dashboard (CIRCUITS, TOKEN_ID, CONTAINER, DELEGATION_EXPIRES, DELEGATION_SIG) survive deploys.
# 后台设置的变量在部署之间保留。
keep_vars = true

# Add your hostname in the dashboard (Worker -> Settings -> Domains & Routes -> Custom domain) and set PUBLIC_URL to it,
# or uncomment and edit these lines. A subdomain, never a path: the endpoint is written into the on-chain manifest.
# 在后台为 Worker 添加自定义域名并把 PUBLIC_URL 设为它，或取消下面的注释并修改。用子域名而不是路径：端点写在链上清单里。
# [[routes]]
# pattern = "relay.example.com"
# custom_domain = true

# One Durable Object per room: the only way every isolate sees the same room.
# 每个房间一个 Durable Object：这是让所有隔离实例看到同一个房间的唯一办法。
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# The meter of a PRICED relay (RELAY_PRICE_BEM != "0"), and required for one: relay-worker.js refuses to start a
# priced relay without it, because a meter in isolate memory serves each voucher once per isolate (arch A1).
# A free relay needs no D1. Create it, apply the schema in d1-store.js, then uncomment and put in its id:
#   npx wrangler d1 create tapeapi-relay-meter
# 收费中继（RELAY_PRICE_BEM 不为 "0"）的计量库，且是必需的：没有它 relay-worker.js 拒绝启动收费中继，因为放在隔离实例内存里的
# 计量会让每张凭证在每个实例各服务一次（arch A1）。免费中继不需要 D1。先创建、按 d1-store.js 建表，再取消注释并填入 id。
# [[d1_databases]]
# binding = "DB"
# database_name = "tapeapi-relay-meter"
# database_id = "REPLACE-WITH-THE-ID-FROM-wrangler-d1-create"

# Logs: Cloudflare's per-request invocation logs and traces are OFF by default here, query strings redacted; the
# Worker's own console output (errors, setup notes) is kept. While debugging, set invocation_logs = true for a while:
# those records describe every request, and whether they include the client IP is to be verified.
# 日志：这里默认关闭 Cloudflare 的逐请求调用日志与追踪，隐去查询串；保留 Worker 自己的 console 输出（错误、设置提示）。
# 排查问题时可临时把 invocation_logs 设为 true：那些记录描述每个请求，是否含客户端 IP 待核实。
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[vars]
SERVICE_NAME = "relay.tape"
# Your relay's public URL, the same one the holder console publishes. / 你的中继的公开网址，与持有人控制台发布的一致。
PUBLIC_URL = "https://relay.example.com"
RELAY_PRICE_BEM = "0"
# New rooms one client IP may create per minute, per isolate (arch A2). / 每个客户端 IP 每分钟（每个隔离实例）可新建的房间数。
RATE_NEW_ROOMS = "60"
# RELAY_SWEEP_MS / RELAY_ROOM_TTL_MS shorten the room alarm and lifetime for smoke-local.mjs only; never set them here.
# RELAY_SWEEP_MS / RELAY_ROOM_TTL_MS 只供 smoke-local.mjs 缩短房间 alarm 与寿命；不要在这里设置。
# The identity is NOT set here: a value in this file would overwrite the dashboard's on every deploy. Set CIRCUITS,
# TOKEN_ID, CONTAINER, DELEGATION_EXPIRES and DELEGATION_SIG in the dashboard (the holder console shows them), and the
# secret SIGNER_KEY; until then the relay answers only its health, in setup mode.
# 身份不写在这里：写在本文件里的值每次部署都会覆盖后台的值。CIRCUITS 等变量在后台设置（持有人控制台会显示），
# 密钥 SIGNER_KEY 设为 Secret；在此之前中继处于设置模式，只回答健康检查。

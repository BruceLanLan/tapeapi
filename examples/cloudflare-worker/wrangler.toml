# A TapeAPI provider on its own Worker and its own hostname: the template a fork deploys with `npm run deploy:provider`.
# Rename the Worker if you like. The project's own public service (api.tapeapi.fun) deploys from examples/public-api.
# 独立 Worker、独立主机名上的 TapeAPI 提供者：fork 用 `npm run deploy:provider` 部署的模板。本项目的公共服务从 examples/public-api 部署。
name = "my-tapeapi-service"
main = "worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the dashboard survive a git-push redeploy / 后台设置的变量在 git 推送重新部署后保留
keep_vars = true

# A subdomain, never a path on an existing site: the endpoint URL is written into the on-chain manifest, so
# moving hosts later costs a SiteRegistry.putFile transaction. A hostname you control can be repointed for free.
# 用子域名而不是现有站点的路径：端点 URL 写在链上清单里，以后搬家要花一笔 putFile 交易。
# 自己控制的主机名可以免费改指向。
# Add your hostname in the dashboard (Worker -> Settings -> Domains & Routes -> Custom domain) and set PUBLIC_URL to it,
# or uncomment and edit these lines. / 在后台为 Worker 添加自定义域名并把 PUBLIC_URL 设为它，或取消下面的注释并修改。
# [[routes]]
# pattern = "api.example.com"
# custom_domain = true

# NO [placement] block on purpose: the default is the edge nearest the caller, which is what a signing API wants.
# Smart Placement would pin this Worker near D1 and add hundreds of milliseconds for callers far from it.
# 刻意不写 [placement]：默认就是离调用方最近的边缘，这正是签名 API 想要的。
# Smart Placement 会把这个 Worker 固定在 D1 附近，对远处的调用方多出几百毫秒。

[observability]
enabled = true

[vars]
SERVICE_NAME = "TapeAPI Reader"
# PUBLIC_URL = "https://api.example.com"   your own https hostname; set it here or in the dashboard (setup mode lists it
#                                         as missing until it is set) / 你自己的 https 主机名；未设置时设置模式会列为缺失
# 2-of-3 operators (quorum 2): NodeReal, Alchemy, 48 Club, the SDK's rpcUrlsFor(56). One down still leaves a quorum (arch A5);
# the SDK counts agreement by operator, so several bsc-dataseed hosts (all NodeReal) count once.
# 三家取二：NodeReal、Alchemy、48 Club（SDK 的 rpcUrlsFor(56)）。一家宕机仍有法定数；SDK 按运营方计票，多个 bsc-dataseed（都是 NodeReal）只算一家。
RPC_URLS = "https://bsc-dataseed.bnbchain.org,https://bsc-mainnet.public.blastapi.io,https://rpc-bsc.48.club"
# CIRCUITS, TOKEN_ID, CONTAINER, DELEGATION_EXPIRES and DELEGATION_SIG are set in the Cloudflare dashboard (Settings ->
# Variables and Secrets), as the holder console at tapeapi.fun/console shows them; SIGNER_KEY is a secret set the same
# way. Until all are set the Worker answers only its health, in setup mode. keep_vars keeps dashboard values when a
# git push redeploys. / 这几个变量在 Cloudflare 后台设置（操作台会给出值），SIGNER_KEY 作为密钥同样在后台设置；设齐之前
# Worker 只以设置模式回答健康检查。keep_vars 让后台设置的值在 git 推送触发重新部署时保留。

# Only needed once a method is priced. A free service needs no D1 at all.
# 只有当某个方法开始收费时才需要。全免费的服务完全不需要 D1。
# [[d1_databases]]
# binding = "DB"
# database_name = "tapeapi-meter"
# database_id = "..."

# The one secret, set in the dashboard (type Secret) or with `npx wrangler secret put SIGNER_KEY`, never in this file:
#   SIGNER_KEY      the hot signing key named by the delegation / 委托指定的热签名密钥
# CIRCUITS, TOKEN_ID, CONTAINER, DELEGATION_EXPIRES and DELEGATION_SIG are public: dashboard variables of type Text.
# 其余五个值是公开的：在后台设为 Text 类型的变量。

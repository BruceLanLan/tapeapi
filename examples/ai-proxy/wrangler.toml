# The AI signing sidecar on its own Worker and its own hostname: a template. Deploy with
#   npx --yes wrangler@4.141.0 deploy -c examples/ai-proxy/wrangler.toml
# Your OpenAI-compatible API stays where it is; UPSTREAM_BASE_URL points at it.
# 独立 Worker、独立主机名上的 AI 签名旁路模板。你的 OpenAI 兼容接口留在原处，UPSTREAM_BASE_URL 指向它。
name = "my-tapeapi-ai-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the dashboard survive a redeploy / 后台设置的变量在重新部署后保留
keep_vars = true

# A subdomain of yours, never a path on an existing site: the base URL is written into the on-chain manifest.
# Add it in the dashboard (Worker -> Settings -> Domains & Routes -> Custom domain) and set PUBLIC_URL to it.
# No routes here on purpose. / 用你自己的子域名：接口地址写在链上清单里。在后台添加自定义域名并把 PUBLIC_URL 设为它。这里刻意不写路由。

[observability]
enabled = true

[vars]
SERVICE_NAME = "My AI service"
# The /v1 base URL of YOUR OpenAI-compatible API. Edit this line. / 你的 OpenAI 兼容接口的 /v1 地址。改这一行。
UPSTREAM_BASE_URL = "https://your-ai-gateway.example/v1"
# The price table published on chain: prices per 1M tokens (input, output; optional cacheRead, cacheWrite, reasoning),
# currency BEM, BNB, USDT, USDC, ETH or USD; "formats": [...] limits an entry to some API formats.
# 发布到链上的价目表：每百万 token 的价格（输入、输出；可选缓存读、缓存写、推理），formats 可限定适用的 API 格式。
MODELS_JSON = '[{"id":"your-model","price":{"currency":"BEM","unit":"1M tokens","input":"0.15","output":"0.60"}}]'
# PUBLIC_URL = "https://ai.example.com"   this Worker's own https hostname / 本 Worker 自己的 https 主机名
# CIRCUITS, TOKEN_ID, CONTAINER, DELEGATION_EXPIRES and DELEGATION_SIG are set in the Cloudflare dashboard (Settings ->
# Variables and Secrets), as the holder console at tapeapi.fun/console shows them.
# 这几个变量在 Cloudflare 后台设置（操作台会给出值）。

# Secrets, set in the dashboard (type Secret) or with `npx wrangler secret put <NAME>`, never in this file:
#   SIGNER_KEY               the hot signing key named by the delegation / 委托指定的热签名密钥
#   UPSTREAM_AUTHORIZATION   optional, and only if the upstream takes YOUR key instead of your callers' (then this Worker
#                            authenticates no one: put your own gateway in front) / 可选；仅当上游用你的密钥而非调用方的密钥

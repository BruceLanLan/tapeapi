<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · TapeAPI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Served by Cloudflare Pages for any missing path, so every link and asset here is absolute. No script, no external
     resource. / Cloudflare Pages 对任何不存在的路径返回本页，所以这里的链接和资源都用绝对路径。无脚本、无外部资源。 -->
<style>
  :root { color-scheme: light; --bg: #EEF0F3; --panel: #FFFFFF; --ink: #0C0F14; --ink-2: #3D4550; --ink-3: #78818E; --hair: #CCD2DA; --amber: #B4660A; --amber-ink: #8A4E06; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #0A0C10; --panel: #12161D; --ink: #EEF1F5; --ink-2: #A9B2BF; --ink-3: #6E7887; --hair: #262D38; --amber: #FFB224; --amber-ink: #FFC759; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Helvetica Neue", "PingFang SC", "Noto Sans SC", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; padding: 28px 24px; }
  .rail { display: flex; gap: 12px; align-items: center; font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; color: var(--ink-3); }
  .rail img { width: 28px; height: 28px; }
  .rail b { color: var(--amber); }
  .code { font: 700 64px/1 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 22px 0 8px; letter-spacing: -.02em; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 6px 0 0; color: var(--ink-2); overflow-wrap: anywhere; }
  hr { border: 0; border-top: 1px solid var(--hair); margin: 18px 0; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--hair); border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 600; }
  nav a:first-child { border-color: var(--amber); color: var(--amber-ink); }
  nav a:hover, nav a:focus-visible { border-color: var(--amber); outline: none; }
  nav span { color: var(--ink-3); font-weight: 400; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <div class="rail"><img src="/favicon.svg" alt=""><b>TAPEAPI</b><span>BNB Smart Chain · 56</span></div>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This address is not a page of tapeapi.fun. The link may be old or mistyped.</p>
  <hr>
  <h1 lang="zh-CN">页面不存在</h1>
  <p lang="zh-CN">tapeapi.fun 上没有这个地址。链接可能已过期，或者输错了。</p>
  <nav aria-label="TapeAPI">
    <a href="/">Home<span lang="zh-CN">首页</span></a>
    <a href="/docs/">Docs<span lang="zh-CN">手册</span></a>
    <a href="/playground/">Playground<span lang="zh-CN">调试台</span></a>
  </nav>
</main>
</body>
</html>
